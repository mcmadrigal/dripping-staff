<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ece7df" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
  <title>Dripping — Staff</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <div id="hdr"></div>
  <div class="shell" id="app"></div>
  <script src="demo-data.js?v=35"></script>
  <script src="app.js?v=34"></script>
  <script>
    const app = document.getElementById('app');
    const teamId = getParam('team');
    const personId = getParam('id');
    const fromHome = getParam('from') === 'home';

    if (!teamId || !personId) { location.href = 'index.html'; }
    else if (!getSheetId() && !window.DEMO_DATA) { location.href = 'index.html'; }
    else {
      showLoading(app);
      Promise.all([fetchTab('_teams'), fetchTab('_contacts'), fetchTab(teamId), fetchTab('_config')]).then(([teamsMeta, contacts, data, config]) => {
        const rainMode = (config || []).some(c => c.key === 'rain_mode' && String(c.value).toLowerCase() === 'true');
        const meta = teamsMeta.find(t => t.team_id === teamId) || {};
        const teamName = meta.team_name || teamId;

        const shared = [];
        const personRows = [];
        let personInfo = null;
        for (const row of data) {
          const pid = row.person_id || '';
          if (pid === '_shared') { if (row.section || row.content) shared.push(row); continue; }
          if (pid === personId) {
            if (!personInfo && (row.name || row.role)) {
              personInfo = { name: row.name, phone: row.phone, role: row.role, paid: row.paid || '', parking: row.parking || '', rider_pdf: row.rider_pdf || '', rider_pdf_title: row.rider_pdf_title || '' };
            }
            if (row.section || row.content) personRows.push(row);
          }
        }

        const name = personInfo?.name || personId;
        const isPaid = personInfo?.paid === 'yes' || personInfo?.paid === true;
        document.title = `${name} — Dripping`;
        document.getElementById('hdr').innerHTML = renderHeader(teamName);

        let h = '';
        const backHref = fromHome ? 'index.html' : `team.html?id=${encodeURIComponent(teamId)}`;
        const backLabel = fromHome ? 'All Staff' : teamName;
        h += `<a href="${backHref}" class="back">← ${esc(backLabel)}</a>`;

        h += `<div class="title-area">
          <h1>${escName(name)}</h1>
          ${personInfo?.role ? `<div class="subtitle">${esc(personInfo.role)}</div>` : ''}
        </div>`;

        h += renderContactsBar(contacts);

        // Teams whose _shared content is team-page-only (not repeated on individual pages)
        const TEAM_ONLY_SHARED = new Set();
        // Teams whose personal Meals row should render BEFORE the team-shared sections.
        const MEALS_FIRST = new Set(['archival_audio']);

        // If MEALS_FIRST for this team, hoist Meals to the very top.
        let mealsRendered = false;
        if (MEALS_FIRST.has(teamId)) {
          const mealsRow = personRows.find(r => r.section === 'Meals');
          if (mealsRow && isPaid) {
            h += renderSection(mealsRow.section, mealsRow.content);
            mealsRendered = true;
          }
        }

        // Shared sections (skip "Paid Staff" section if person is not paid)
        if (!TEAM_ONLY_SHARED.has(teamId)) {
          for (const row of shared) {
            if ((row.section === 'Paid Staff' || row.section === 'Perks') && !isPaid) continue;
            h += renderSection(row.section, row.content);
          }
        }

        // Rain mode: rename Rain Plan → Schedule and skip the original Schedule rows.
        // Off mode: render rows as-is (Schedule + Rain Plan both visible).
        const isScheduleSection = s => /Schedule$/i.test(s || '');
        for (const row of personRows) {
          if (row.section === 'Meals' && !isPaid) continue;
          if (row.section === 'Meals' && mealsRendered) continue;
          if (rainMode) {
            if (isScheduleSection(row.section)) continue;
            if (row.section === 'Rain Plan') {
              const cleaned = (row.content || '')
                .replace(/\s*\(same[^)]*\)\s*/gi, ' ')
                .replace(/\n\s*---\s*\n\s*\*\*Original Schedule \(for reference\):\*\*\s*\n+/g, '\n\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n');
              h += renderSection('Schedule', cleaned);
              continue;
            }
          }
          h += renderSection(row.section, row.content);
        }

        if (personInfo?.parking) h += renderParkingSection(personInfo.parking);
        if (personInfo?.rider_pdf && teamId === 'stage_managers') {
          h += renderRiderPDF(personInfo.rider_pdf, personInfo.rider_pdf_title);
        }

        h += renderRefreshBar();
        app.innerHTML = h;
      }).catch(err => showError(app, err));
    }
  </script>
</body>
</html>
